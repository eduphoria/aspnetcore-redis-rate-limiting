name: CI

on:
  push:
    branches:
      - '**'
    paths-ignore:
      - 'README.md'
  workflow_dispatch:

jobs:
  CI:
    # ubuntu-latest, windows-latest, [self-hosted, Linux], [self-hosted, Windows]
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    # Only configure AWS credentials if absolutely necessary
    # Must use `runs-on`: [self-hosted, Linux] or [self-hosted, Windows] to not leak AWS keys
    # - name: Configure AWS credentials
    #   uses: aws-actions/configure-aws-credentials@v4
    #   with:
    #     aws-region: ${{ vars.DEV_AWS_REGION }}
    #     aws-access-key-id: ${{ secrets.DEV_AWS_ACCESS_KEY_ID }}
    #     aws-secret-access-key: ${{ secrets.DEV_AWS_SECRET_ACCESS_KEY }}

    - name: Build, test, and push NuGet packages
      uses: eduphoria/action-dotnet-library@v2
      with:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        NUGET_AUTH_TOKEN: ${{ secrets.GH_PACKAGES_PASSWORD }}
